name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Validate, E2E & Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate curriculum, links, citations & rendered HTML
        run: npm test

      - name: Verify asset stamps
        run: npm run stamp:check

      - name: Run 4-tier SQLite 3 + PostgreSQL 18 E2E suite
        run: npm run e2e

      - name: Build production bundle
        run: npm run build
